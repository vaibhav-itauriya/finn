name: FINN research precompute

# Refresh the demo companies' research reports. Cached call extractions make re-runs nearly free:
# only a new transcript or a new quarter triggers model work.
on:
  schedule:
    - cron: "5 15 * * *" # 20:35 IST daily
  workflow_dispatch:
    inputs:
      tickers:
        description: "Space-separated NSE tickers (blank = demo set)"
        default: ""
  push:
    paths:
      - "lib/pull/**"
      - "scripts/run-research.ts"
      - ".github/workflows/research.yml"

concurrency:
  group: finn-research
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Precompute
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/run-research.ts ${{ github.event.inputs.tickers }}
      - name: Commit data
        run: |
          git config user.name "finn-bot"
          git config user.email "finn-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "data: research run $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase origin ${{ github.ref_name }} && git push && break; sleep 5; done
