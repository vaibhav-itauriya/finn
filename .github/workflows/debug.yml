name: FINN debug fetch
on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated URLs"
        required: true
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx tsx scripts/debug-fetch.ts ${{ github.event.inputs.urls }}
      - run: |
          git config user.name "finn-bot"; git config user.email "finn-bot@users.noreply.github.com"
          git add data/debug.log; git commit -m "debug fetch" || exit 0
          git pull --rebase -X theirs origin main && git push
